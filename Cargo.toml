[package]
name = "imaging"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.63"

[features]
# Simulates one compromised crate in the dependency tree. Used only by the capability demo.
evil = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
