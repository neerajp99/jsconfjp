[package]
name = "imaging-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
imaging = { path = "../.." }
napi = "3"
napi-derive = "3"

[features]
evil = ["imaging/evil"]

[build-dependencies]
napi-build = "2"

# Same optimisation settings as the component build.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
